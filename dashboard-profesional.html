<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Profesional - AgendApp</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
    .profile-info h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
    .profile-info p { margin: 0.2rem 0 0; color: #94a3b8; font-size: 0.9rem; }
    .btn-logout { background: #dc2626; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
    .stat-card h3 { margin: 0; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
    .stat-card .val { font-size: 1.8rem; font-weight: bold; margin-top: 0.5rem; color: #f8fafc; }

    .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; background: #1e293b; padding: 1rem; border-radius: 8px; }
    input[type="date"] { background: #0f172a; border: 1px solid #475569; color: white; padding: 0.5rem; border-radius: 6px; }
    button.btn-refresh { background: #0284c7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { background: #182234; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    tr:hover { background: #243248; }

    .badge { padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; }
    .badge-PENDIENTE { background: #fef08a; color: #854d0e; }
    .badge-CONFIRMADA { background: #bbf7d0; color: #166534; }
    .badge-FINALIZADA { background: #e2e8f0; color: #334155; }
    .badge-CANCELADA { background: #fecaca; color: #991b1b; }

    select.status-select { background: #0f172a; color: white; border: 1px solid #475569; padding: 0.3rem 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="profile-info">
      <h1 id="pro-name">Cargando...</h1>
      <p id="pro-spec">Especialista</p>
    </div>
    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <!-- Métricas KPI -->
  <section class="kpi-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
    <div class="kpi-card">
      <h3 style="font-size: 13px; color: #94a3b8; text-transform: uppercase;">Total Citas</h3>
      <div class="number" id="kpi-total" style="font-size: 28px; font-weight: 700;">0</div>
    </div>
    <div class="kpi-card">
      <h3 style="font-size: 13px; color: #94a3b8; text-transform: uppercase;">Confirmadas</h3>
      <div class="number" id="kpi-confirmadas" style="font-size: 28px; font-weight: 700; color: #0df2a6;">0</div>
    </div>
    <div class="kpi-card">
      <h3 style="font-size: 13px; color: #94a3b8; text-transform: uppercase;">Pendientes</h3>
      <div class="number" id="kpi-pendientes" style="font-size: 28px; font-weight: 700; color: #f59e0b;">0</div>
    </div>
  </section>

  <div class="controls">
    <label>Filtrar por fecha:</label>
    <input type="date" id="filtro-fecha" onchange="cargarCitas()" />
    <button class="btn-refresh" onclick="cargarCitas(true)">Ver Todas</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Hora</th>
        <th>Fecha</th>
        <th>Cliente</th>
        <th>Teléfono</th>
        <th>Servicio</th>
        <th>Monto</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="citas-body">
      <tr><td colspan="8" style="text-align: center; color: #64748b;">No hay citas registradas.</td></tr>
    </tbody>
  </table>

 <script>
  const API_BASE = 'https://agend-app-version-2.onrender.com/api';

  // 1. Funciones expuestas inmediatamente en el objeto global
  function logout() {
    localStorage.clear();
    window.location.href = 'login_roles.html';
  }

  function getHeaders() {
    const token = localStorage.getItem('token_access');
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return headers;
  }

  // 2. Validación de sesión
  const rawUser = localStorage.getItem('profesional') || 
                  localStorage.getItem('usuario') || 
                  localStorage.getItem('agendapp_user');

  let sessionUser = null;
  try {
    sessionUser = rawUser ? JSON.parse(rawUser) : null;
  } catch (e) {
    sessionUser = null;
  }

  if (!sessionUser) {
    alert('Acceso restringido: Inicia sesión con cuenta de profesional.');
    window.location.href = 'login_roles.html';
  }

  // 3. Resolución de IDs (Usuario vs Profesional)
  let idUsuarioActual = sessionUser?.id_usuario || sessionUser?.id || null;
  let idProfesionalReal = sessionUser?.id_profesional || null;

  async function resolverIdProfesional() {
    // Si id_profesional es distinto de id_usuario o no viene definido, confirmar contra el backend
    try {
      const res = await fetch(`${API_BASE}/personal/profesionales/`, { headers: getHeaders() });
      if (res.ok) {
        const data = await res.json();
        const lista = Array.isArray(data) ? data : (data.results || []);
        const proEncontrado = lista.find(p => {
          const userFk = p.id_usuario?.id_usuario || p.id_usuario || p.usuario_id;
          return userFk == idUsuarioActual || p.correo === sessionUser?.correo;
        });

        if (proEncontrado) {
          idProfesionalReal = proEncontrado.id_profesional ?? proEncontrado.id;
          sessionUser.id_profesional = idProfesionalReal;
          localStorage.setItem('profesional', JSON.stringify(sessionUser));
        }
      }
    } catch (e) {
      console.warn('No se pudo verificar el id_profesional remoto, usando id base:', e);
    }

    if (!idProfesionalReal) {
      idProfesionalReal = idUsuarioActual;
    }
  }

  // 4. Carga y renderizado de citas
async function cargarCitas() {
    const tbody = document.getElementById('citas-body') || document.querySelector('table tbody');
    const headerTitle = document.querySelector('h1') || document.querySelector('.title-pro');
    
    const nombre = sessionUser?.nombre ? `${sessionUser.nombre} ${sessionUser.apellido || ''}`.trim() : 'Especialista';
    if (headerTitle) {
      headerTitle.textContent = `Bienvenido, ${nombre}`;
    }

    if (!idProfesionalReal) {
      await resolverIdProfesional();
    }

    try {
      // 1. Consulta al backend (prioriza filtro por profesional)
      let res = await fetch(`${API_BASE}/reservas/citas/?profesional=${idProfesionalReal}&_t=${Date.now()}`, { 
        headers: getHeaders() 
      });
      
      if (!res.ok) {
        res = await fetch(`${API_BASE}/reservas/citas/?_t=${Date.now()}`, { headers: getHeaders() });
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      let citas = Array.isArray(data) ? data : (data.results || []);

      // 2. Filtrado tolerante por profesional o usuario
      citas = citas.filter(c => {
        const fk = c.id_profesional?.id_profesional || c.id_profesional || c.profesional_id || c.profesional;
        return fk == idProfesionalReal || fk == idUsuarioActual;
      });

      // 3. Cálculo de métricas
      const total = citas.length;
      const confirmadas = citas.filter(c => (c.estado || '').toUpperCase() === 'CONFIRMADA').length;
      const pendientes = citas.filter(c => (c.estado || '').toUpperCase() === 'PENDIENTE').length;

      // 4. Inyección robusta en las tarjetas KPI superiores
      const elementsNumber = document.querySelectorAll('.number');
      const kpiTotal = document.getElementById('kpi-total') || elementsNumber[0];
      const kpiConf = document.getElementById('kpi-confirmadas') || elementsNumber[1];
      const kpiPend = document.getElementById('kpi-pendientes') || elementsNumber[2];

      if (kpiTotal) kpiTotal.textContent = total;
      if (kpiConf) kpiConf.textContent = confirmadas;
      if (kpiPend) kpiPend.textContent = pendientes;

      if (!tbody) return;

      if (citas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#94a3b8; padding:18px;">No hay citas registradas para este especialista.</td></tr>';
        return;
      }

      // 5. Renderizado de filas de la tabla
      tbody.innerHTML = citas.map(c => {
        const fechaHora = c.fecha_hora_inicio || '';
        const fecha = fechaHora ? fechaHora.slice(0, 10) : '-';
        const hora = fechaHora ? fechaHora.slice(11, 16) : '-';
        const cliente = c.cliente_nombre || c.nombre_cliente || (c.id_cliente ? `Cliente #${c.id_cliente}` : 'Cliente');
        const tel = c.telefono_cliente || c.cliente_telefono || '-';
        const servicio = c.servicio_nombre || c.nombre_servicio || (c.id_servicio ? `Servicio #${c.id_servicio}` : 'Servicio');
        const monto = c.precio ?? c.precio_total ?? c.monto ?? 0;
        const estado = c.estado || 'CONFIRMADA';
        const idCita = c.id_cita ?? c.id;

        return `
          <tr>
            <td><strong>${hora}</strong></td>
            <td>${fecha}</td>
            <td>${cliente}</td>
            <td>${tel}</td>
            <td>${servicio}</td>
            <td>$${Number(monto).toLocaleString('es-CL')}</td>
            <td><span class="badge ${estado === 'CONFIRMADA' ? 'badge-success' : 'badge-danger'}">${estado}</span></td>
            <td>
              <button onclick="cambiarEstadoCita(${idCita}, 'COMPLETADA')" style="background:#0df2a6; border:none; border-radius:4px; padding:4px 8px; font-size:11px; font-weight:bold; cursor:pointer;">Finalizar</button>
            </td>
          </tr>
        `;
      }).join('');

    } catch (err) {
      console.error('Error al cargar agenda del profesional:', err);
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#ef4444; padding:18px;">Error al cargar agenda: ${err.message}</td></tr>`;
      }
    }
  }

  async function cambiarEstadoCita(idCita, nuevoEstado) {
    try {
      const res = await fetch(`${API_BASE}/reservas/citas/${idCita}/`, {
        method: 'PATCH',
        headers: getHeaders(),
        body: JSON.stringify({ estado: nuevoEstado })
      });
      if (res.ok) {
        cargarCitas();
      } else {
        alert('No se pudo actualizar el estado de la cita.');
      }
    } catch (e) {
      alert('Error de conexión al actualizar la cita.');
    }
  }

  // 5. Inicialización automática al cargar el DOM
  document.addEventListener('DOMContentLoaded', () => {
    cargarCitas();
  });
</script>
</body>
</html>
