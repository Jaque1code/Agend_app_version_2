services:
  postgres_db:
    image: postgres:16-alpine
    container_name: agendapp_postgres
    restart: always
    environment:
      POSTGRES_DB: agendapp_db
      POSTGRES_USER: admin_agendapp
      POSTGRES_PASSWORD: password_segura_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata_agendapp:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: agendapp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agendapp.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

  backend:
    build: ./backend
    container_name: agendapp_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=agendapp_db
      - DB_USER=admin_agendapp
      - DB_PASSWORD=password_segura_2026
      - DB_HOST=postgres_db
      - DB_PORT=5432
    depends_on:
      - postgres_db

volumes:
  pgdata_agendapp: